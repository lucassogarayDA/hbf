[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hbf"
version = "2.1.1"
description = "Hybrid Binary Format - Un formato de archivo todo en uno"
readme = "README.md"
authors = [{name = "Lucas Sogaray", email = "lucassogaray72@gmail.com"}]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "cryptography"
]

[project.scripts]
hbf = "hbf:main"

[tool.setuptools]
py-modules = ["hbf"]
