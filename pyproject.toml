[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hbf-hyper"
version = "3.0.1"
description = "Hybrid Binary Format - Un formato de archivo todo en uno"
readme = "README.md"
authors = [{name = "Lucas Sogaray", email = "lucassogaray72@gmail.com"}]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Filesystems",
]

[project.urls]
"Source Code" = "https://github.com/lucassogarayDA/hbf"
"Documentation" = "https://github.com/lucassogarayDA/hbf#readme"
"Issue Tracker" = "https://github.com/lucassogarayDA/hbf/issues"

dependencies = [
    "cryptography",
    "pillow"
]

[project.scripts]
hbf = "hbf:main"

[tool.setuptools]
py-modules = ["hbf"]
